name: Build & Release

# On every push to main: push a multi-arch server image to ghcr.io tagged
# :latest and :sha-<short> (for testing).
# On a vX.Y.Z tag: build the static binaries and the client .deb, publish the
# image as :X.Y.Z (immutable), :X.Y and :X (floating, so users can pin a
# major/minor line and still get patch releases) and :latest, and cut a GitHub
# Release with the binaries + .deb attached. Pre-release tags (vX.Y.Z-rc1) only
# get :X.Y.Z-rc1.
# Binaries/.deb/release are gated to tags so merging a release PR and then
# tagging the same commit does not rebuild them twice.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Don't stack runs for the same ref: a newer push to main cancels an in-flight
# main run. Tags each have a unique ref, so a release run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only by default, each job widens only what it needs.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/ftaeger/pbs-sync-auth

jobs:
  binaries:
    # Release artifacts: only on tags (or a manual run), not on every main push.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The client is only built for amd64: Proxmox Backup Server ships
          # x86_64-only, so there is no supported ARM host to install it on.
          # The server is built multi-arch (the auth host may be a Raspberry Pi).
          - { goarch: amd64, client: true }
          - { goarch: arm64 }
          - { goarch: arm, goarm: '7' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      - name: Build static binaries (server always; client on amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          BUILD_CLIENT: ${{ matrix.client }}
        run: |
          mkdir -p dist
          arch="${GOARCH}${GOARM:+v$GOARM}"
          comps="server"
          [ "${BUILD_CLIENT}" = "true" ] && comps="server client"
          for comp in $comps; do
            ( cd "$comp" && go build -ldflags="-s -w" -o "../dist/pbs-auth-$comp-linux-$arch" . )
          done
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # sign the provenance attestation (Sigstore)
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Verifiable with: gh attestation verify oci://ghcr.io/ftaeger/pbs-sync-auth:<tag> -R ftaeger/pbs-sync-auth
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deb:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-amd64
          path: dist
      - name: Determine package version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"          # vX.Y.Z -> X.Y.Z
          else
            v="0.0.0~git$(git rev-parse --short HEAD)"   # main snapshot
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build Debian package (client, amd64)
        run: |
          chmod +x dist/pbs-auth-client-linux-amd64
          packaging/build-deb.sh dist/pbs-auth-client-linux-amd64 \
            "${{ steps.ver.outputs.version }}" amd64 deb-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-amd64
          path: deb-out/*.deb
          if-no-files-found: error

  release:
    needs: [binaries, deb]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # sign the provenance attestations (Sigstore)
      attestations: write   # store the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      # Verifiable with: gh attestation verify <file> -R ftaeger/pbs-sync-auth
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*
      - name: Extract release notes from CHANGELOG.md
        run: |
          # The "## [X.Y.Z]" section for this tag, without its heading.
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (on) exit; on = (index($0, "## [" v "]") == 1); next }
            /^\[[^]]+\]: / { if (on) exit }
            on' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1
          fi
          cat release-notes.md
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: on a re-run the release may already exist, so update its
          # notes and assets instead of failing on `gh release create`.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi

  # Rebuild the signed APT repo from all release .debs and deploy it to Pages.
  # Runs after `release` on a tag, or standalone via workflow_dispatch (to
  # (re)publish from the releases that already exist).
  apt:
    needs: [release]
    if: >
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialize Pages deploys without cancelling an in-flight one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro
      - name: Import signing key
        run: printf '%s\n' "${GPG_PRIVATE_KEY}" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Download .deb assets from all releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern '*.deb' --dir debs --skip-existing || true
          done
          ls -l debs
      - name: Build signed APT repo
        run: packaging/build-apt-repo.sh debs public "${{ vars.GPG_KEY_FPR }}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
