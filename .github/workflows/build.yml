name: Build & Release

# On every push to main: push a multi-arch server image to ghcr.io tagged
# :latest and :sha-<short> (for testing).
# On a vX.Y.Z tag: build the static binaries and the client .deb, publish a
# versioned image, and cut a GitHub Release with the binaries + .deb attached.
# Binaries/.deb/release are gated to tags so merging a release PR and then
# tagging the same commit does not rebuild them twice.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Don't stack runs for the same ref: a newer push to main cancels an in-flight
# main run. Tags each have a unique ref, so a release run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # create GitHub releases
  packages: write   # push to ghcr.io

env:
  IMAGE: ghcr.io/ftaeger/pbs-sync-auth

jobs:
  binaries:
    # Release artifacts: only on tags (or a manual run), not on every main push.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The client is only built for amd64: Proxmox Backup Server ships
          # x86_64-only, so there is no supported ARM host to install it on.
          # The server is built multi-arch (the auth host may be a Raspberry Pi).
          - { goarch: amd64, client: true }
          - { goarch: arm64 }
          - { goarch: arm, goarm: '7' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
      - name: Build static binaries (server always; client on amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          BUILD_CLIENT: ${{ matrix.client }}
        run: |
          mkdir -p dist
          arch="${GOARCH}${GOARM:+v$GOARM}"
          comps="server"
          [ "${BUILD_CLIENT}" = "true" ] && comps="server client"
          for comp in $comps; do
            ( cd "$comp" && go build -ldflags="-s -w" -o "../dist/pbs-auth-$comp-linux-$arch" . )
          done
          ls -l dist
      - uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deb:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: binaries-amd64
          path: dist
      - name: Determine package version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"          # vX.Y.Z -> X.Y.Z
          else
            v="0.0.0~git$(git rev-parse --short HEAD)"   # main snapshot
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build Debian package (client, amd64)
        run: |
          chmod +x dist/pbs-auth-client-linux-amd64
          packaging/build-deb.sh dist/pbs-auth-client-linux-amd64 \
            "${{ steps.ver.outputs.version }}" amd64 deb-out
      - uses: actions/upload-artifact@v6
        with:
          name: deb-amd64
          path: deb-out/*.deb
          if-no-files-found: error

  release:
    needs: [binaries, deb]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  # Rebuild the signed APT repo from all release .debs and deploy it to Pages.
  # Runs after `release` on a tag, or standalone via workflow_dispatch (to
  # (re)publish from the releases that already exist).
  apt:
    needs: [release]
    if: >
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialize Pages deploys without cancelling an in-flight one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro
      - name: Import signing key
        run: printf '%s\n' "${GPG_PRIVATE_KEY}" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Download .deb assets from all releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern '*.deb' --dir debs --skip-existing || true
          done
          ls -l debs
      - name: Build signed APT repo
        run: packaging/build-apt-repo.sh debs public "${{ vars.GPG_KEY_FPR }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v5
