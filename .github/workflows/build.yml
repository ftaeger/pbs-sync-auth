name: Build & Release

# On every push to main: build static binaries (as workflow artifacts) and push
# a multi-arch server image to ghcr.io tagged :latest and :sha-<short>.
# On a vX.Y.Z tag: additionally publish a versioned image and a GitHub Release
# with the binaries attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create GitHub releases
  packages: write   # push to ghcr.io

env:
  IMAGE: ghcr.io/ftaeger/pbs-sync-auth

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The client is only built for amd64: Proxmox Backup Server ships
          # x86_64-only, so there is no supported ARM host to install it on.
          # The server is built multi-arch (the auth host may be a Raspberry Pi).
          - { goarch: amd64, client: true }
          - { goarch: arm64 }
          - { goarch: arm, goarm: '7' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build static binaries (server always; client on amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          BUILD_CLIENT: ${{ matrix.client }}
        run: |
          mkdir -p dist
          arch="${GOARCH}${GOARM:+v$GOARM}"
          comps="server"
          [ "${BUILD_CLIENT}" = "true" ] && comps="server client"
          for comp in $comps; do
            ( cd "$comp" && go build -ldflags="-s -w" -o "../dist/pbs-auth-$comp-linux-$arch" . )
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deb:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries-amd64
          path: dist
      - name: Determine package version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"          # vX.Y.Z -> X.Y.Z
          else
            v="0.0.0~git$(git rev-parse --short HEAD)"   # main snapshot
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build Debian package (client, amd64)
        run: |
          chmod +x dist/pbs-auth-client-linux-amd64
          packaging/build-deb.sh dist/pbs-auth-client-linux-amd64 \
            "${{ steps.ver.outputs.version }}" amd64 deb-out
      - uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: deb-out/*.deb
          if-no-files-found: error

  release:
    needs: [binaries, deb]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
