name: CI

# Validate both Go modules on every pull request (fmt, vet, test, build, and a
# govulncheck scan). The weekly schedule re-runs the scan so newly published
# stdlib vulnerabilities surface even when nothing is merged.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [client, server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        # Tool only; not a module dependency (the code stays stdlib-only).
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  package:
    # Sanity-check the Debian packaging so a broken packaging/ fails the PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      - name: Build client binary (amd64)
        env: { CGO_ENABLED: '0', GOOS: linux, GOARCH: amd64 }
        run: go build -C client -ldflags="-s -w" -o "$PWD/pbs-auth-client-linux-amd64" .
      - name: Build .deb
        run: packaging/build-deb.sh pbs-auth-client-linux-amd64 0.0.0~ci amd64 deb-out
