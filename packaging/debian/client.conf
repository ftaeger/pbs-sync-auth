# Configuration for the pbs-sync-auth client.
# Loaded by the systemd service as an EnvironmentFile, so every line is a plain
# KEY=value pair (no quoting/export needed; lines starting with # are comments).

# Path to the shared secret file (32 bytes, hex). This file is NOT shipped by
# the package. Create it with the same content as the server's key, e.g.:
#   openssl rand -hex 32 | sudo tee /etc/pbs-sync-auth/secret.key >/dev/null
#   sudo chmod 600 /etc/pbs-sync-auth/secret.key
PBS_AUTH_SECRET=/etc/pbs-sync-auth/secret.key

# URL of the auth server. https:// is recommended (TLS is the first gate);
# http:// is also supported because the HMAC auth is unforgeable on its own.
PBS_AUTH_URL=https://pbs-sync-auth.example.com

# PBS push sync job to run locally on successful authentication.
PBS_SYNC_JOB=offsite-push

# How often the daemon runs a cycle (authenticate, check the central side, and
# start the sync job if a backup is due).
PBS_CHECK_INTERVAL=30m

# Minimum time between successful syncs. 0 = sync on every successful check.
# Example: check every 2h but back up at most every 12h ->
#   PBS_CHECK_INTERVAL=2h
#   PBS_MIN_BACKUP_INTERVAL=12h
PBS_MIN_BACKUP_INTERVAL=0

# HTTP timeout for the auth requests.
PBS_AUTH_TIMEOUT=3s

# TLS options (https only). Defaults verify against the system root CAs, which
# is correct for a publicly trusted (e.g. Let's Encrypt) certificate.
#   PBS_AUTH_TLS_VERIFY=false                 # disable verification (test/dev only)
#   PBS_AUTH_TLS_CA=/etc/pbs-sync-auth/ca.pem # trust an internal CA bundle
