# pbs-sync-auth behind Traefik, TLS via Let's Encrypt (DNS-01 challenge, Cloudflare).
#
# Use this when the host is NOT publicly reachable on port 80 (internal service):
# the certificate is issued via a DNS TXT record instead of an inbound HTTP request.
#
# Requirements:
#   - $DOMAIN is managed in Cloudflare
#   - CF_DNS_API_TOKEN with Zone > DNS > Edit for that zone
#   - ./secret.key present:  openssl rand -hex 32 > secret.key
#
# Usage:
#   cp .env.example .env        # set DOMAIN + ACME_EMAIL + CF_DNS_API_TOKEN
#   docker compose -f docker-compose.dns01-cloudflare.yml up -d

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # redirect all plain HTTP to HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  pbs-sync-auth:
    image: ghcr.io/ftaeger/pbs-sync-auth:1
    restart: unless-stopped
    environment:
      PBS_AUTH_HOST: "0.0.0.0"
      PBS_AUTH_PORT: "8099"
      PBS_AUTH_SECRET: /run/secrets/pbs_auth_secret
      # Trust the proxy's X-Forwarded-For so the server logs the real client IP.
      # 172.16.0.0/12 covers Docker's default network pools; narrow it to this
      # stack's subnet (docker network inspect) if your clients live in that range.
      PBS_TRUSTED_PROXIES: "172.16.0.0/12"
    volumes:
      # Shared secret, mounted read-only. Identical to the client's secret.
      - ./secret.key:/run/secrets/pbs_auth_secret:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.pbsauth.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.pbsauth.entrypoints=websecure
      - traefik.http.routers.pbsauth.tls.certresolver=le
      # Per-client-IP rate limit: a source PBS needs 2 requests per check
      # interval, so 1 req/s with a burst of 5 never affects legitimate clients.
      - traefik.http.routers.pbsauth.middlewares=pbsauth-ratelimit
      - traefik.http.middlewares.pbsauth-ratelimit.ratelimit.average=1
      - traefik.http.middlewares.pbsauth-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.pbsauth-ratelimit.ratelimit.burst=5
      # Optional allowlist (clients with fixed IPs): uncomment and append
      # ",pbsauth-allow" to the middlewares line above.
      # - traefik.http.middlewares.pbsauth-allow.ipallowlist.sourcerange=203.0.113.10/32,198.51.100.0/24
      - traefik.http.services.pbsauth.loadbalancer.server.port=8099
      - traefik.http.services.pbsauth.loadbalancer.healthcheck.path=/healthz
