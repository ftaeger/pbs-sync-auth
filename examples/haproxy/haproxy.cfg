global
    log stdout format raw local0 info

defaults
    mode    http
    log     global
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Resolve the backend container name via Docker's embedded DNS.
resolvers docker
    nameserver dns 127.0.0.11:53

# Redirect plain HTTP to HTTPS.
frontend http_in
    bind :80
    http-request redirect scheme https unless { ssl_fc }

# TLS termination. The cert file must contain the full chain AND the private key
# concatenated into one PEM (see README: certs/haproxy.pem).
frontend https_in
    bind :443 ssl crt /usr/local/etc/haproxy/certs/haproxy.pem

    # Pass the real client IP to the auth server (X-Forwarded-For).
    option forwardfor

    # Optional allowlist (clients with fixed IPs):
    # acl pbs_clients src 203.0.113.10 198.51.100.0/24
    # http-request deny deny_status 403 unless pbs_clients

    # Per-client-IP rate limit: more than 20 requests in 10 s -> 429. A source
    # PBS needs 2 requests per check interval, so clients are never affected.
    stick-table type ipv6 size 10k expire 60s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 20 }

    default_backend pbs_auth

backend pbs_auth
    server app pbs-sync-auth:8099 check resolvers docker init-addr libc,none
