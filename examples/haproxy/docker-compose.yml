# pbs-sync-auth behind HAProxy, TLS terminated by HAProxy (bring your own certificate).
#
# Requirements:
#   - ./secret.key present:  openssl rand -hex 32 > secret.key
#   - ./certs/haproxy.pem present (full chain + private key concatenated, see README)
#
# Usage:
#   docker compose up -d

services:
  haproxy:
    image: haproxy:3.0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs:/usr/local/etc/haproxy/certs:ro
    depends_on:
      - pbs-sync-auth

  pbs-sync-auth:
    image: ghcr.io/ftaeger/pbs-sync-auth:latest
    restart: unless-stopped
    # No published ports: only reachable through HAProxy on the internal network.
    environment:
      PBS_AUTH_HOST: "0.0.0.0"
      PBS_AUTH_PORT: "8099"
      PBS_AUTH_SECRET: /run/secrets/pbs_auth_secret
    volumes:
      # Shared secret, mounted read-only. Identical to the client's secret.
      - ./secret.key:/run/secrets/pbs_auth_secret:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
