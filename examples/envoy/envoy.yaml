# Static Envoy config: TLS termination on :443, HTTP->HTTPS redirect on :80,
# reverse proxy to the auth server. Bring your own certificate (see README).
static_resources:
  listeners:
    - name: https
      address:
        socket_address: { address: 0.0.0.0, port_value: 443 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /etc/envoy/certs/fullchain.pem }
                    private_key: { filename: /etc/envoy/certs/privkey.pem }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                # Append the real downstream address to X-Forwarded-For (and
                # ignore client-supplied hops) so the auth server can log it.
                use_remote_address: true
                route_config:
                  virtual_hosts:
                    - name: pbs
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: pbs_auth }
                http_filters:
                  # Rate limit (token bucket for the whole listener, not per
                  # client IP): 5 requests/s, burst 20, then 429.
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: pbs_auth_ratelimit
                      token_bucket:
                        max_tokens: 20
                        tokens_per_fill: 5
                        fill_interval: 1s
                      filter_enabled:
                        default_value: { numerator: 100, denominator: HUNDRED }
                      filter_enforced:
                        default_value: { numerator: 100, denominator: HUNDRED }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: http_redirect
      address:
        socket_address: { address: 0.0.0.0, port_value: 80 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  virtual_hosts:
                    - name: redirect
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          redirect: { https_redirect: true }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: pbs_auth
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: pbs_auth
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: pbs-sync-auth, port_value: 8099 }
